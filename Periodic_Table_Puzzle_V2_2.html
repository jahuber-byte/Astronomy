<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Periodic Table Puzzle · Property Detectives</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172b46;background:#eef4fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:22px 16px 55px}header{background:#153657;color:white;border-radius:18px;padding:24px 28px}header h1{margin:0 0 6px;font-size:clamp(1.55rem,3vw,2.25rem)}header p{margin:0;color:#dceafa}.panel{background:white;border:1px solid #d5e1ec;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 3px 12px #203f5b0c}.progress{display:flex;gap:8px;margin:18px 0}.step{flex:1;height:8px;border-radius:10px;background:#ccdbe8}.step.done{background:#16817b}.step.active{background:#3277bb}h2{margin:0 0 10px;font-size:1.45rem}h3{margin:0 0 8px}.muted{color:#52677d}.small{font-size:.88rem}.btn{background:#215d99;border:2px solid #215d99;color:white;padding:11px 16px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}.btn:hover{background:#154675}.btn:focus-visible,.tile:focus-visible,.choice:focus-visible,.slot:focus-visible{outline:3px solid #e49b18;outline-offset:2px}.btn.secondary{background:white;color:#174d80}.btn.secondary:hover{background:#e8f2fb}.btn:disabled{opacity:.48;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.notice{padding:13px 15px;border-radius:10px;margin-top:14px;background:#e8f2ff;border-left:5px solid #3979bc;line-height:1.5}.notice.good{background:#e3f5ec;border-color:#188358}.notice.bad{background:#fff0e9;border-color:#bc6235}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:14px}.tile,.choice{display:block;width:100%;text-align:left;background:#e8f2ff;color:#152e49;border:2px solid #7fa8d1;border-radius:11px;padding:13px;cursor:pointer;font:inherit;line-height:1.42}.tile:hover,.choice:hover{background:#d8eafb}.tile.selected,.choice.selected{background:#b9dcfa;border-color:#164f8c;box-shadow:inset 0 0 0 1px #164f8c}.tile.used{background:#e8f3ed;border-color:#8cb9a1;color:#234636}.tile strong{display:block;margin-bottom:5px}.board-wrap{overflow-x:auto;padding:4px 1px 8px}.board{display:grid;grid-template-columns:35px repeat(2,minmax(65px,1fr)) 22px repeat(6,minmax(65px,1fr));gap:5px;min-width:690px}.headcell{font-size:.76rem;text-align:center;color:#516a81;align-self:end;padding:6px 0}.period{font-size:.8rem;font-weight:700;display:flex;align-items:center;color:#52677d}.slot{min-height:69px;border:2px solid #b5c9da;border-radius:9px;background:#f1f5f9;color:#223a52;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:4px;cursor:pointer;font:inherit}.slot strong{font-size:1.13rem}.slot em{font-style:normal;font-size:.68rem}.slot.target{background:#fff3d6;border:2px dashed #b87b1d}.slot.filled{background:#d8eafa;border:2px solid #356b9d}.slot.anchor{background:#e8edf2;cursor:default}.slot.empty{background:transparent;border:0;cursor:default}.slot.placeholder{background:#e9edf3;border:2px solid #bdcbd8;color:#3b536b;cursor:default}.gapcell{pointer-events:none}.slot.correct{background:#def2e6;border-color:#238056}.slot.wrong{background:#ffe4db;border-color:#bc6235}.prompt{font-size:1.1rem;line-height:1.6;padding:14px;background:#f3f7fb;border-radius:10px}.count{font-weight:700;color:#32658f}.footer{text-align:center;color:#63778a;margin-top:22px;font-size:.8rem}.tag{display:inline-block;background:#e2edf7;color:#285377;border-radius:7px;padding:4px 8px;font-size:.78rem;font-weight:700}.hidden{display:none!important}@media(max-width:600px){.panel{padding:16px}.shell{padding:12px 10px 35px}header{padding:20px}.cards{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><main class="shell"><header><h1>🧩 Periodic Table Puzzle</h1><p>Property Detectives · Main-group elements · Periods 2–4</p></header><div class="progress" id="progress" aria-label="Mission progress"></div><section class="panel" id="app" aria-live="polite"></section><div class="footer">Use your paper periodic table. The challenge is to explain patterns—not memorize element locations. • Offline classroom activity</div></main><script>
'use strict';
const groups=[1,2,13,14,15,16,17,18];
const elems=[
[['Li',3],['Be',4],['B',5],['C',6],['N',7],['O',8],['F',9],['Ne',10]],
[['Na',11],['Mg',12],['Al',13],['Si',14],['P',15],['S',16],['Cl',17],['Ar',18]],
[['K',19],['Ca',20],['Ga',31],['Ge',32],['As',33],['Se',34],['Br',35],['Kr',36]]];
const family=[
{id:'alkali',label:'Alkali metals · Group 1',clue:'Soft metals that readily form +1 ions and react strongly with water (hydrogen is an exception).',why:'Group 1 metals have one valence electron and tend to lose it, forming +1 ions.'},
{id:'earth',label:'Alkaline earth metals · Group 2',clue:'Reactive metals that commonly form +2 ions; generally less reactive with water than alkali metals.',why:'Group 2 metals have two valence electrons and commonly lose both.'},
{id:'g13',label:'Group 13 (3A)',clue:'This column includes boron and aluminum; its main-group atoms have three valence electrons.',why:'Main-group elements in Group 13 have three valence electrons. Boron is a metalloid; aluminum is a metal.'},
{id:'g14',label:'Group 14 (4A)',clue:'This column contains a nonmetal used in living things and a metalloid widely used in computer chips.',why:'Carbon and silicon are in Group 14; their atoms have four valence electrons.'},
{id:'g15',label:'Group 15 (5A)',clue:'This column contains nitrogen, a gas making up most of Earth’s atmosphere, and phosphorus, a solid nonmetal.',why:'Nitrogen and phosphorus share five valence electrons and occupy Group 15.'},
{id:'g16',label:'Group 16 (6A)',clue:'This column contains oxygen and sulfur; its atoms generally have six valence electrons.',why:'Oxygen and sulfur are Group 16 elements with six valence electrons.'},
{id:'halogen',label:'Halogens · Group 17',clue:'Reactive nonmetals that often form −1 ions and react with metals to form salts.',why:'Halogens have seven valence electrons and often gain one to form −1 ions.'},
{id:'noble',label:'Noble gases · Group 18',clue:'Gases with filled outer electron shells that are relatively unreactive.',why:'Noble gases have full valence shells (helium has two electrons), making them comparatively unreactive.'}
];
const familyOrder=[3,6,1,4,0,7,2,5];
const elementNames=['Sodium','Magnesium','Aluminum','Silicon','Phosphorus','Sulfur','Chlorine','Argon'];
const puzzle=[
{id:'A',symbol:'Na',r:1,c:0,clue:'A soft metal that reacts vigorously with water. It resembles lithium chemically, but its atoms have one more occupied electron shell.',reason:'Sodium resembles lithium chemically: both are soft, reactive metals that commonly form +1 ions.',choices:['Its atomic mass is exactly 23 u.','Like lithium, it is a soft metal that reacts strongly with water and commonly forms a +1 ion.','All metals react equally with water.'],correct:1},
{id:'B',symbol:'Si',r:1,c:3,clue:'A brittle metalloid used in semiconductor devices. Carbon is another member of its chemical family, although carbon is a nonmetal.',reason:'Silicon and carbon share four valence electrons, helping explain similarities in their bonding despite their different classifications.',choices:['It is a gas like carbon dioxide.','It has seven valence electrons.','Like carbon, its atoms have four valence electrons and can form four covalent bonds.'],correct:2},
{id:'C',symbol:'Br',r:2,c:6,clue:'A reddish-brown liquid at room temperature. It has chemical behavior similar to chlorine, but a greater atomic mass.',reason:'Bromine and chlorine are reactive nonmetals with seven valence electrons; both commonly form −1 ions and react with metals to form salts.',choices:['It is the only liquid metal.','It reacts with metals in ways similar to chlorine and commonly forms −1 ions.','It rarely reacts because its outer electron shell is filled.'],correct:1},
{id:'D',symbol:'Ar',r:1,c:7,clue:'A colorless gas that is relatively unreactive. Neon has similar chemical behavior but a smaller atomic mass.',reason:'Argon has a filled outer electron shell, which helps explain its low chemical reactivity, similar to neon.',choices:['Its outer electron shell is filled, so it is relatively unreactive like neon.','It reacts strongly with water.','It commonly forms a −1 ion.'],correct:0},
{id:'E',symbol:'Al',r:1,c:2,clue:'A lightweight, malleable metal. Boron is a lighter member of its chemical family, although boron is a metalloid.',reason:'Aluminum is a metal with three valence electrons, whereas boron is a metalloid with the same number of valence electrons.',choices:['All elements in its group are metalloids.','Like boron, its atoms have three valence electrons, even though their physical properties differ.','All lightweight metals have two valence electrons.'],correct:1},
{id:'F',symbol:'S',r:1,c:5,clue:'A yellow, brittle solid nonmetal. It belongs to the same chemical family as oxygen but has a greater atomic mass.',reason:'Sulfur and oxygen are nonmetals with six valence electrons and can form compounds with metals in which they have a −2 charge.',choices:['Like oxygen, it has six valence electrons and can form a −2 ion in compounds with metals.','Yellow elements must be metals.','It is a halogen because it is reactive.'],correct:0}
];
const quiz=[
{q:'Magnesium and calcium are in the same group. Which prediction is best supported?',a:['Both are noble gases.','Both commonly form +2 ions.','Both have seven valence electrons.','Both are liquids at room temperature.'],c:1,why:'Group 2 metals have two valence electrons and commonly form +2 ions.'},
{q:'An unknown main-group element has three occupied electron shells and seven valence electrons. Where does it belong?',a:['Period 7, Group 3','Period 3, Group 17','Period 3, Group 7','Period 2, Group 17'],c:1,why:'Three occupied shells indicate Period 3; seven valence electrons indicate Group 17 (7A).'},
{q:'Which pair is most likely to have similar chemical behavior?',a:['Na and K','Na and Ar','Mg and Cl','Si and S'],c:0,why:'Sodium and potassium are both alkali metals in Group 1 and share the same valence-electron pattern.'},
{q:'Why are the noble gases generally much less reactive than the halogens?',a:['Noble gases are always heavier.','Noble gases have filled outer electron shells.','Noble gases are all solids.','Halogens have no valence electrons.'],c:1,why:'A filled valence shell is a stable arrangement; halogens have seven valence electrons and readily gain one.'},
{q:'Which statement best compares boron and aluminum?',a:['Both are gases.','Both are classified as metals.','They share a group and have three valence electrons, but boron is a metalloid and aluminum is a metal.','They have the same atomic mass.'],c:2,why:'The same group can contain elements with different classifications; both have three valence electrons.'},
{q:'A student claims that two elements must behave similarly because both are gases at room temperature. What is the strongest response?',a:['Yes, physical state always determines chemical behavior.','No, elements in the same group are more likely to share chemical behavior because of similar valence-electron arrangements.','Yes, all gases are noble gases.','No, gases cannot react with metals.'],c:1,why:'Physical state alone does not establish a chemical family; valence electrons help explain group similarities.'}
];
let mission=0,selected=null,placements={},checked=false,feedback='',hint=false,reasonIndex=0,reasonChoice=null,reasonDone=false,quizIndex=0,quizChoice=null,quizDone=false,score=0;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function progress(){document.getElementById('progress').innerHTML=[0,1,2].map(i=>`<div class="step ${i<mission?'done':i===mission?'active':''}" title="Mission ${i+1}"></div>`).join('')}
function notice(text,type=''){return text?`<div class="notice ${type}" role="status">${text}</div>`:''}
function board(targets){
 let h='<div class="board-wrap"><div class="board"><div></div>';
 groups.forEach((g,c)=>{if(c===2)h+='<div class="gapcell"></div>';h+=`<div class="headcell">${g}<br><span class="small">${g<=2?g+'A':(g-10)+'A'}</span></div>`});
 // The H/He placeholders visually locate the first period without making it part of either puzzle.
 h+='<div class="period">P1</div><div class="slot placeholder" aria-label="Hydrogen, non-interactive"><strong>H</strong><em>Hydrogen</em></div><div class="gapcell"></div>';
 // P1 has H at group 1, a spacer under group 2 and the transition-metal gap, and He at group 18.
 // Rebuild P1 explicitly so it occupies the same nine board columns as all other rows.
 h=h.replace('<div class="period">P1</div><div class="slot placeholder" aria-label="Hydrogen, non-interactive"><strong>H</strong><em>Hydrogen</em></div><div class="gapcell"></div>',
 '<div class="period">P1</div><div class="slot placeholder" aria-label="Hydrogen, non-interactive"><strong>H</strong><em>Hydrogen</em></div>'+Array(7).fill('<div class="gapcell"></div>').join('')+'<div class="slot placeholder" aria-label="Helium, non-interactive"><strong>He</strong><em>Helium</em></div>');
 for(let r=0;r<3;r++){
  h+=`<div class="period">P${r+2}</div>`;
  for(let c=0;c<8;c++){
   if(c===2)h+='<div class="gapcell"></div>';
   let el=elems[r][c],key=r+'-'+c,target=targets.find(x=>x.r===r&&x.c===c),p=placements[key];
   let state=target?(p?'filled':'target'):'anchor';
   if(checked&&target&&p)state=p===target.symbol?'correct':'wrong';
   const isFamily=mission===0;
   const isCorrect=!!(target&&checked&&p===target.symbol);
   let symbol,subtitle;
   if(!target){symbol=el[0];subtitle='reference'}
   else if(isCorrect){symbol=isFamily?elems[1][c][0]:target.symbol;subtitle=isFamily?elementNames[c]:({Na:'Sodium',Si:'Silicon',Br:'Bromine',Ar:'Argon',Al:'Aluminum',S:'Sulfur'}[target.symbol]||'Correct')}
   else if(p){
    if(isFamily){symbol='Clue '+String.fromCharCode(65+familyOrder.indexOf(family.findIndex(f=>f.id===p)));subtitle='placed'}
    else{let match=puzzle.find(x=>x.symbol===p);symbol=match?'Mystery '+match.id:'Mystery';subtitle='placed'}
   }else{symbol='?';subtitle='place here'}
   h+=`<button type="button" class="slot ${state}" ${target?'data-slot="'+key+'"':'disabled'} aria-label="Period ${r+2} Group ${groups[c]}: ${target?(isCorrect?subtitle:(p?'mystery card placed':'empty')):el[0]}"><strong>${esc(symbol)}</strong><em>${esc(subtitle)}</em></button>`;
  }
 }
 return h+'</div></div>';
}
function mission0(){let targets=family.map((f,i)=>({r:1,c:i,symbol:f.id}));let filled=Object.keys(placements).length;let all=filled===8&&family.every((f,i)=>placements['1-'+i]===f.id);app.innerHTML=`<span class="tag">Mission 1 of 3</span><h2>Decode the Element Families</h2><p class="muted">Your paper periodic table lists some family names, but not all. Read each property clue and place its card in the correct <b>group column</b>. The target row represents Period 3. After you check correct placements, the actual Period 3 element names will be revealed.</p><p class="count">${filled} / 8 family cards placed</p>${board(targets)}<h3>Property clue cards</h3><div class="cards">${familyOrder.map((idx,i)=>{let f=family[idx];return `<button type="button" class="tile ${selected===f.id?'selected':''} ${Object.values(placements).includes(f.id)?'used':''}" data-card="${f.id}"><strong>Clue ${String.fromCharCode(65+i)}</strong>${esc(f.clue)}</button>`}).join('')}</div>${notice(feedback,checked?(all?'good':'bad'):'')}<div class="actions"><button class="btn" id="check" ${filled!==8?'disabled':''}>Check placements</button><button class="btn secondary" id="hint">Hint</button><button class="btn secondary" id="clear">Clear board</button>${all&&checked?'<button class="btn" id="next">Next mission →</button>':''}</div>${hint?notice('Hint: Look for a shared pattern: ion charge, valence electrons, reactivity, or the examples of elements mentioned in the clue. The column headings on the board show modern and A-group numbers.') :''}`;bindBoard();}
function mission1(){const targets=puzzle;const filled=Object.keys(placements).length;const all=filled===6&&puzzle.every(p=>placements[p.r+'-'+p.c]===p.symbol);let p=puzzle[reasonIndex];app.innerHTML=`<span class="tag">Mission 2 of 3</span><h2>Reconstruct the Missing Elements</h2><p class="muted">Use family relationships and physical properties. Your paper table is allowed. Select a mystery card, then an empty square. The table will show only mystery labels until you check your placements. After checking, explain each placement using chemical or physical properties.</p><p class="count">${filled} / 6 mystery cards placed</p>${board(targets)}<h3>Mystery element cards</h3><div class="cards">${puzzle.map(x=>`<button type="button" class="tile ${selected===x.symbol?'selected':''} ${Object.values(placements).includes(x.symbol)?'used':''}" data-card="${x.symbol}"><strong>Mystery ${x.id}</strong>${esc(x.clue)}</button>`).join('')}</div>${notice(feedback,checked?(all?'good':'bad'):'')}<div class="actions"><button class="btn" id="check" ${filled!==6?'disabled':''}>Check placements</button><button class="btn secondary" id="hint">Hint</button><button class="btn secondary" id="clear">Clear board</button></div>${hint?notice('Hint: Use the clues “same group as” and “one period below” first. A group is a vertical column; a period is a horizontal row.'):''}${all&&checked?`<hr style="border:0;border-top:1px solid #d8e2eb;margin:22px 0"><h3>Explain your placements · ${reasonIndex+1} of 6</h3><div class="prompt">Which property-based explanation best supports placing Mystery ${p.id} (${p.symbol}) with elements that behave similarly?</div><div class="cards">${p.choices.map((a,i)=>`<button class="choice ${reasonChoice===i?'selected':''}" data-reason="${i}" ${reasonDone?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>${reasonDone?notice((reasonChoice===p.correct?'Correct. ':'Not quite. ')+esc(p.reason),reasonChoice===p.correct?'good':'bad'):''}<div class="actions">${!reasonDone?'<button class="btn" id="reasoncheck" '+(reasonChoice===null?'disabled':'')+'>Check explanation</button>':`<button class="btn" id="reasonnext">${reasonIndex===5?'Next mission →':'Next explanation →'}</button>`}</div>`:''}`;bindBoard();}
function mission2(){let q=quiz[quizIndex];app.innerHTML=`<span class="tag">Mission 3 of 3</span><h2>Predict the Properties</h2><p class="muted">Use your periodic table to make predictions. Choose the best answer; after checking, read the explanation before moving on.</p><p class="count">Question ${quizIndex+1} of ${quiz.length}</p><div class="prompt">${esc(q.q)}</div><div class="cards">${q.a.map((a,i)=>`<button class="choice ${quizChoice===i?'selected':''}" data-answer="${i}" ${quizDone?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>${quizDone?notice((quizChoice===q.c?'Correct! ':'Not quite. ')+esc(q.why),quizChoice===q.c?'good':'bad'):''}<div class="actions">${!quizDone?`<button class="btn" id="quizcheck" ${quizChoice===null?'disabled':''}>Check answer</button>`:`<button class="btn" id="quiznext">${quizIndex===quiz.length-1?'Finish activity →':'Next question →'}</button>`}</div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizChoice=+b.dataset.answer;render()});if(document.getElementById('quizcheck'))document.getElementById('quizcheck').onclick=()=>{quizDone=true;if(quizChoice===q.c)score++;render()};if(document.getElementById('quiznext'))document.getElementById('quiznext').onclick=()=>{if(quizIndex===quiz.length-1){mission=3}else{quizIndex++;quizChoice=null;quizDone=false}render()}}
function finish(){let code='PZ-'+String((score*37+194)%997).padStart(3,'0')+'-GROUP';app.innerHTML=`<span class="tag">Activity complete</span><h2>🎉 Periodic Table Puzzle completed!</h2><p>You used periodic-table patterns to identify element families, reconstruct missing elements, and predict properties.</p><p><strong>Mission 3 first-attempt score:</strong> ${score} of ${quiz.length}. All missions completed.</p><div class="notice good"><b>Schoology completion code:</b> <span style="font-size:1.3rem;letter-spacing:1px;font-weight:800">${code}</span><br><span class="small">This code confirms completion, not identity. Students may share the same code.</span></div><div class="actions"><button class="btn secondary" id="restart">Restart activity</button><button class="btn secondary" id="copy">Copy code</button></div>`;document.getElementById('restart').onclick=()=>{mission=0;selected=null;placements={};checked=false;feedback='';hint=false;reasonIndex=0;reasonChoice=null;reasonDone=false;quizIndex=0;quizChoice=null;quizDone=false;score=0;render()};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('copy').textContent='Copied!'}catch(e){document.getElementById('copy').textContent='Select and copy code above'}}}
function bindBoard(){document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{selected=b.dataset.card;feedback='';checked=false;render()});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let key=b.dataset.slot;if(!selected)return;for(const k of Object.keys(placements))if(placements[k]===selected)delete placements[k];placements[key]=selected;feedback='';checked=false;render()});let ck=document.getElementById('check');if(ck)ck.onclick=()=>{checked=true;const targets=mission===0?family.map((f,i)=>({r:1,c:i,symbol:f.id})):puzzle;let right=targets.filter(t=>placements[t.r+'-'+t.c]===t.symbol).length;feedback=right===targets.length?'All placements correct!':`${right} of ${targets.length} correct. Red squares need another look. Select a card and try again.`;render()};document.getElementById('clear').onclick=()=>{placements={};selected=null;checked=false;feedback='';render()};document.getElementById('hint').onclick=()=>{hint=!hint;render()};let nx=document.getElementById('next');if(nx)nx.onclick=()=>{mission++;selected=null;placements={};checked=false;feedback='';hint=false;render()};document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{reasonChoice=+b.dataset.reason;render()});let rc=document.getElementById('reasoncheck');if(rc)rc.onclick=()=>{reasonDone=true;render()};let rn=document.getElementById('reasonnext');if(rn)rn.onclick=()=>{if(reasonIndex===5){mission=2}else{reasonIndex++;reasonChoice=null;reasonDone=false}render()}}
function render(){progress();if(mission===0)mission0();else if(mission===1)mission1();else if(mission===2)mission2();else finish()}
render();
</script></body></html>
