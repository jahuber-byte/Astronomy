<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Periodic Table Time Machine</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19283a;background:#eef3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:20px}header{background:linear-gradient(115deg,#112c4a,#245b75);color:white;padding:25px 20px}header .wrap{padding:0}h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem)}h2{margin:0 0 10px}p{line-height:1.55}.sub{opacity:.85}.panel{background:white;border:1px solid #d7e0e9;border-radius:16px;padding:clamp(18px,3vw,30px);box-shadow:0 4px 18px #172f4a0b;margin-top:18px}.eyebrow{color:#326785;text-transform:uppercase;letter-spacing:.1em;font-weight:800;font-size:.8rem}.progress{height:12px;border-radius:10px;background:#d7e3eb;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#1e897e;transition:width .25s}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{padding:8px 10px;background:#e8f0f5;color:#233d54}.nav button.current{background:#1c5477;color:white}.nav button:disabled{opacity:.4;cursor:not-allowed}button{border:0;border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer;font-size:1rem;background:#155c84;color:white}button:hover:not(:disabled){filter:brightness(1.09)}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e8f0f5;color:#16415c}.options{display:grid;gap:9px;margin:18px 0}.options button{text-align:left;background:#f1f5f9;color:#1c354c;border:2px solid #d8e3eb}.options button:hover{background:#e5f2f7}.options button.selected{border-color:#166e9d;background:#d9edf9}.feedback{padding:14px;border-radius:10px;margin:14px 0;background:#e8f0f5;border-left:5px solid #7b9ab1}.feedback.good{background:#e4f5ed;border-color:#23805d}.feedback.bad{background:#fff0e8;border-color:#d17a42}.cards{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.element{border:2px solid #abc1d1;border-radius:10px;background:#f2f8fc;padding:13px;min-width:95px;text-align:center}.element b{display:block;font-size:1.65rem}.element small{display:block}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.prompt{font-weight:700;font-size:1.12rem}select,input{font:inherit;border:2px solid #b7cbd8;border-radius:9px;padding:10px;max-width:100%;background:white}select{min-width:180px}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}.tag{display:inline-block;border-radius:100px;background:#e2eef4;color:#25536c;padding:5px 12px;font-weight:700;font-size:.85rem}.mini{font-size:.92rem;color:#516779}.timeline{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.timeline span{padding:6px 9px;background:#e4ecf2;border-radius:6px;font-size:.82rem}.timeline span.on{background:#b8e4d5;color:#145a45}.hidden{display:none}.note{border-left:4px solid #7c96b4;padding:7px 13px;background:#f2f6fa}.prediction{border:2px dashed #9db7c9;border-radius:12px;padding:15px;margin:15px 0}.success{background:#e2f5e8;border:2px solid #48a47a;padding:18px;border-radius:12px;text-align:center}.code{font-family:ui-monospace,monospace;font-size:clamp(1.4rem,5vw,2.3rem);font-weight:900;letter-spacing:.09em;margin:10px 0;overflow-wrap:anywhere}footer{text-align:center;color:#5a6c7c;padding:25px;font-size:.85rem}@media(max-width:550px){.row>*{flex:auto;width:100%}.element{min-width:76px}}
.brief-hero{border-radius:15px;padding:24px;background:linear-gradient(125deg,#20394d,#506778);color:white;margin:16px 0}.brief-hero .era{font-size:clamp(1.3rem,3.5vw,2rem);font-weight:800}.brief-scene{font-size:2.5rem;letter-spacing:.16em;margin:10px 0}.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:17px 0}.brief-card{background:#f3f7fa;border:1px solid #d5e2eb;border-radius:12px;padding:16px}.brief-card h3{font-size:1rem;margin:0 0 8px;color:#234f6a}.brief-card p{margin:0}.brief-card.mystery{background:#fff7e7;border-color:#e8d0a0}.brief-footer{display:flex;justify-content:flex-end;margin-top:22px}.brief-footer button{font-size:1.1rem;padding:15px 24px}@media(max-width:620px){.brief-grid{grid-template-columns:1fr}}
.element.focus-pair{background:#fff0c8;border-color:#b77c13;box-shadow:0 0 0 2px #f3d88e inset}.element.focus-pair b{color:#744400}.sequence-caption{font-weight:700;color:#34566b;margin:14px 0 5px}.element-sequence{gap:8px}.element-sequence .element{flex:1 1 115px;min-width:105px;padding:11px 7px}.sequence-hint{font-size:.92rem;color:#5a6471;margin-top:5px} </style></head><body><header><div class="wrap"><div class="tag">Experience 2 · Chemistry</div><h1>⏳ The Periodic Table Time Machine</h1><div class="sub">Six missions. One big scientific mystery: how do we organize the elements?</div></div></header><main class="wrap"><div class="panel"><div class="row"><strong id="progressLabel">Mission 1 of 6</strong><span class="mini" id="doneLabel">0 of 6 completed</span></div><div class="progress" aria-label="Completion progress"><div id="bar" style="width:0%"></div></div><nav class="nav" id="nav" aria-label="Mission navigation"></nav><div class="timeline" id="timeline"></div></div><section class="panel" id="mission" aria-live="polite"></section></main><footer>All activity runs locally in this browser. No login, account, or internet connection required.</footer><script>
const missions=[['Ancient ideas','Before 1600'],['The experimental turn','1600s–1700s'],['Döbereiner’s triads','1829'],['Newlands’ octaves','1865'],['Mendeleev’s prediction','1869'],['Moseley’s atomic number','1913']];
let stage=0, unlocked=0, completed=Array(6).fill(false), state={}, feedback='',good=false, briefing=true;
const $=id=>document.getElementById(id);
function setFeedback(t,ok){feedback=t;good=ok;render()}function complete(t){completed[stage]=true;unlocked=Math.max(unlocked,stage+1);feedback=t;good=true;render()}
function optionButtons(opts,chosen,fn){return `<div class="options">${opts.map(([v,t])=>`<button type="button" class="${chosen===v?'selected':''}" data-choice="${v}">${t}</button>`).join('')}</div>`}
function bindOptions(fn){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>fn(b.dataset.choice))}

const briefings=[
{era:'Ancient world → early modern era',scene:'🪔 🏺 📜',light:'Oil lamps, candles, hand-copied manuscripts',belief:'There was no single accepted atomic theory. Greek atomism competed with four-element ideas; thinkers in India and China developed different explanations of matter.',known:'Gold, copper, iron, sulfur, charcoal and salt were familiar substances, but “element” did not yet mean a chemical substance defined by experiment.',mystery:'Can an explanation of invisible matter be supported by observations rather than argument alone?'},
{era:'1600s–late 1700s',scene:'🕯️ ⚗️ ⚖️',light:'Candles and oil lamps; furnaces, balances and glassware',belief:'Alchemy and older elemental ideas persisted, while experimenters increasingly demanded reproducible evidence. Boyle challenged traditional definitions; Lavoisier later helped establish a new chemical framework.',known:'Metals, sulfur and other materials were familiar. By the late 1700s, oxygen and hydrogen had been identified as distinct substances, and chemists could measure masses with increasing care.',mystery:'When a reaction produces a gas, does matter vanish—or has it merely changed form?'},
{era:'1829 · Döbereiner',scene:'🕯️ ⚖️ 🧪',light:'Oil lamps and candles; gas lighting in some towns',belief:'Dalton’s atomic theory was influential but debated; atomic masses were being estimated and refined. Chemists had no atomic-number system or electron model.',known:'Dozens of elements were recognized. Chemists knew that chlorine, bromine and iodine had related chemical behavior, and had approximate relative atomic masses.',mystery:'Can similar substances be grouped using a numerical pattern?'},
{era:'1865 · Newlands',scene:'🔥 🏭 🧪',light:'Gaslights in many cities; electric lighting not yet common',belief:'Atoms and atomic masses were useful organizing ideas, but there was no agreed periodic table. Chemists debated how best to classify the growing list of elements.',known:'Roughly 60 elements were known. Better atomic-mass estimates helped chemists compare elements and search for recurring chemical properties.',mystery:'If you arrange elements by mass, do their properties repeat at regular intervals?'},
{era:'1869 · Mendeleev',scene:'🔥 🚂 📋',light:'Gaslights, steam trains and handwritten element cards',belief:'Chemists increasingly recognized repeating chemical properties, but there was no consensus about the best arrangement. The electron, proton and atomic number as we now define it were unknown.',known:'About 63 elements were known. Atomic masses and chemical formulas supplied clues, but the list contained gaps and occasional uncertain measurements.',mystery:'Would you leave an empty space in your table—and dare to predict what belongs there?'},
{era:'1913 · Moseley',scene:'💡 📻 ⚡',light:'Electric lamps, telephones and laboratory X-ray equipment',belief:'The periodic table was established, and scientists had evidence for electrons and the atomic nucleus. The nuclear charge underlying atomic number was being clarified.',known:'More than 80 elements were known. X-ray spectra could be measured; some mass-based orderings, such as tellurium and iodine, remained awkward.',mystery:'What measurable property determines an element’s true position in the periodic table?'}
];
function briefingHtml(){const b=briefings[stage];return `<div class="eyebrow">Time-travel briefing · Before mission ${stage+1}</div><h2>The state of our understanding</h2><div class="brief-hero"><div class="era">${b.era}</div><div class="brief-scene" aria-hidden="true">${b.scene}</div><div>🌟 <strong>Life in this era:</strong> ${b.light}</div></div><div class="brief-grid"><div class="brief-card"><h3>💭 What people believed</h3><p>${b.belief}</p></div><div class="brief-card"><h3>🔎 What was known</h3><p>${b.known}</p></div><div class="brief-card mystery" style="grid-column:1/-1"><h3>❓ The unsolved problem</h3><p>${b.mystery}</p></div></div><p class="mini">Historical snapshot: ideas differed among scientists and across regions; these are broad summaries, not beliefs held by everyone.</p><div class="brief-footer"><button id="work">Get to Work →</button></div>`}

function missionHtml(){let h='';const s=state[stage]||{};
switch(stage){
case 0:h=`<div class="eyebrow">Mission 1 · Before 1600</div><h2>What is everything made of?</h2><p>People in ancient Greece, India, China, and other cultures developed explanations of matter. Democritus proposed tiny indivisible particles called <em>atomos</em>. Other thinkers described matter using elements or principles such as earth, water, air, fire, or <em>qi</em>.</p><p class="note">A powerful idea is not automatically a scientific conclusion. Scientists need evidence that can distinguish competing explanations.</p><p class="prompt">A student says, “All matter is made of tiny particles that cannot be seen.” Which response best shows scientific thinking?</p>${optionButtons([['a','It must be true because an ancient thinker said it.'],['b','What observations or experiments could test that claim?'],['c','It must be false because we cannot see the particles.']],s.answer,0)}<p class="mini">Think: What was missing from many early explanations of matter?</p>`;break;
case 1:h=`<div class="eyebrow">Mission 2 · 1600s–1700s</div><h2>From alchemy to experiments</h2><p>Alchemists developed useful laboratory methods. Paracelsus connected chemical substances with medicine. Robert Boyle emphasized experiments and clearer definitions of elements. Antoine Lavoisier made careful mass measurements central to chemistry.</p><p><strong>Mini-lab:</strong> A sealed container holds reactants with a total mass of <strong>125 g</strong>. They react, making a new substance and a gas. The container stays sealed.</p><div class="cards"><div class="element"><b>125 g</b><small>Before reaction</small></div><div class="element"><b>?</b><small>After reaction</small></div></div><p class="prompt">What should the total mass of the sealed container and contents be after the reaction?</p>${optionButtons([['a','Less than 125 g because a gas formed'],['b','Exactly 125 g'],['c','More than 125 g because new substances formed']],s.answer,0)}<p class="mini">Assume nothing enters or leaves the container.</p>`;break;
case 2:h=`<div class="eyebrow">Mission 3 · 1829</div><h2>Find Döbereiner’s hidden pattern</h2><p>Johann Döbereiner noticed that some sets of <strong>three chemically similar elements</strong> had a striking mass pattern: the middle element’s mass was close to the average of the other two.</p><div class="cards"><div class="element"><b>Cl</b><small>Chlorine</small><small>35.5 u</small></div><div class="element"><b>?</b><small>Missing</small></div><div class="element"><b>I</b><small>Iodine</small><small>126.9 u</small></div></div><p>Calculate the average: (35.5 + 126.9) ÷ 2 = <strong>81.2 u</strong>.</p><p class="prompt">Which element best completes the triad?</p>${optionButtons([['a','Sodium (Na), 23.0 u — reactive metal'],['b','Bromine (Br), 79.9 u — chemically similar to chlorine and iodine'],['c','Calcium (Ca), 40.1 u — metal']],s.answer,0)}`;break;
case 3:h=`<div class="eyebrow">Mission 4 · 1865</div><h2>Newlands hears a repeating pattern</h2><p>John Newlands arranged known elements in order of increasing <strong>atomic mass</strong>. He observed that similar properties often appeared at regular intervals, comparing the pattern to musical octaves.</p><p class="note">A simplified early sequence: Li, Be, B, C, N, O, F, Na, Mg, Al, Si, P, S, Cl.</p><div class="cards">${['Li','Be','B','C','N','O','F','Na','Mg','Al','Si','P','S','Cl'].map((x,i)=>`<div class="element" style="min-width:60px;padding:8px"><b style="font-size:1.2rem">${x}</b><small>${i+1}</small></div>`).join('')}</div><p class="prompt">Lithium (Li) and sodium (Na) have similar properties. Counting Li as position 1, what position is Na?</p>${optionButtons([['a','Position 7'],['b','Position 8'],['c','Position 10']],s.answer,0)}<p class="mini">This pattern was useful, but did not work reliably for every known element.</p>`;break;
case 4:if(!s.part){h=`<div class="eyebrow">Mission 5 · 1869 · Part 1 of 2</div><h2>Mendeleev: predict what nobody has found</h2><p>Dmitri Mendeleev arranged elements using <strong>atomic masses and similar chemical properties</strong>. Rather than forcing every element into a filled grid, he left gaps and predicted the properties of missing elements.</p><p>Imagine a family of elements with related chemical behavior:</p><div class="cards"><div class="element"><b>Si</b><small>Silicon</small><small>~28 u</small></div><div class="element"><b>?</b><small>Unknown</small></div><div class="element"><b>Sn</b><small>Tin</small><small>~119 u</small></div></div><p class="prompt">Which prediction would be the most useful scientific test of the table?</p>${optionButtons([['a','An undiscovered element will have properties between silicon and tin, and a mass around 72 u.'],['b','No new elements can exist because the table is complete.'],['c','The unknown element must have exactly the same mass as silicon.']],s.answer,0)}`}
else{h=`<div class="eyebrow">Mission 5 · Discovery revealed · Part 2 of 2</div><h2>Did the prediction work?</h2><p>Mendeleev predicted an element he called <em>eka-silicon</em>. Germanium was discovered in 1886 and matched many of his predictions.</p><div class="cards"><div class="element"><b>Ge</b><small>Germanium</small><small>72.6 u</small></div></div><p class="prompt">Why was this such strong evidence for Mendeleev’s arrangement?</p>${optionButtons([['a','Because the table successfully predicted properties of an element before it was discovered.'],['b','Because every element was already known in 1869.'],['c','Because it proved atomic masses are always whole numbers.']],s.answer,0)}`}
break;
case 5:{const elements=[['Sn','Tin','118.7','50'],['Sb','Antimony','121.8','51'],['Te','Tellurium','127.6','52'],['I','Iodine','126.9','53'],['Xe','Xenon','131.3','54'],['Cs','Cesium','132.9','55']];const cards=(order,showNumber)=>`<div class="cards element-sequence">${order.map(symbol=>{const [sym,name,mass,number]=elements.find(e=>e[0]===symbol);return `<div class="element ${sym==='Te'||sym==='I'?'focus-pair':''}"><b>${sym}</b><small>${name}</small><small>Mass: ${mass} u</small>${showNumber?`<small>Atomic no.: ${number}</small>`:''}</div>`}).join('')}</div>`;h=`<div class="eyebrow">Mission 6 · 1913 · ${s.revealed?'Part 2 of 2':'Part 1 of 2'}</div><h2>Moseley finds a better ordering rule</h2><p>Scientists knew that certain elements had similar chemical properties, but arranging every element strictly by <strong>increasing atomic mass</strong> created a problem.</p><div class="sequence-caption">1. Arrange by increasing atomic mass →</div>${cards(['Sn','Sb','I','Te','Xe','Cs'],false)}<p class="sequence-hint">Read the masses from left to right. The highlighted pair is in the correct mass order, but iodine and tellurium are in the wrong positions for their chemical families.</p>${s.revealed?`<div class="sequence-caption">2. Arrange by increasing atomic number (proton count) →</div>${cards(['Sn','Sb','Te','I','Xe','Cs'],true)}<p class="sequence-hint">Compare the highlighted cards: Te and I swap places. Their atomic numbers increase steadily, even though their atomic masses do not.</p><p>In 1913 Henry Moseley used characteristic <strong>X-ray spectra</strong> to establish the ordering by nuclear charge (atomic number). Today we know atomic number equals the number of protons in the nucleus.</p><p class="prompt">Which rule defines the modern periodic table and preserves the chemical families?</p>${optionButtons([['a','Increasing atomic mass'],['b','Increasing atomic number (proton count)'],['c','Alphabetical order of element names']],s.answer,0)}`:`<p class="prompt">Why is this a problem?</p><p>Based on chemical properties, tellurium belongs before iodine. But putting them in that order would make their masses go <strong>down</strong> from 127.6 u to 126.9 u.</p><button type="button" id="reveal-order">Reveal Moseley’s new evidence →</button>`}`;break;}
}return h}
function choose(v){let s=state[stage]||(state[stage]={});s.answer=v;let ok=false,explain='';switch(stage){case 0:ok=v==='b';explain=ok?'Exactly. A testable explanation can be compared with evidence. Early thinkers raised important questions, but a modern atomic theory needed experiments.':'An idea’s age or invisibility does not decide whether it is scientific. Look for a way to test it.';break;case 1:ok=v==='b';explain=ok?'Correct. In a closed system, total mass is conserved. A gas forming does not mean matter has disappeared.':'Remember that the container is sealed. All the matter, including the gas, remains inside.';break;case 2:ok=v==='b';explain=ok?'Correct! Bromine has a mass close to the predicted 81.2 u and shares chemical properties with chlorine and iodine. The pattern was promising, but not universal.':'Check both clues: a mass near 81.2 u AND similar chemical properties.';break;case 3:ok=v==='b';explain=ok?'Correct! Sodium is the eighth element in this simplified sequence, echoing Newlands’ octave idea. His pattern eventually broke down for many elements.':'Count from Li as 1, then Be as 2, and keep going.';break;case 4:if(!s.part){ok=v==='a';explain=ok?'That is a testable prediction. Mendeleev could be proved wrong if the predicted element never appeared or had very different properties.':'A strong model predicts something new that observations could check.';if(ok){s.part=1;s.answer='';feedback='Part 1 complete! You have advanced to Part 2 of 2: test Mendeleev’s prediction against the discovery of germanium.';good=true;render();return}}else{ok=v==='a';explain=ok?'Exactly. Successful predictions made the periodic table much more than a convenient list.':'The key achievement was a successful prediction made before the element was discovered.'}break;case 5:ok=v==='b';explain=ok?'Correct. Te has atomic number 52, followed by iodine at 53. Atomic number, not atomic mass, defines the modern order.':'Look at the proton counts: 52 must come before 53.';break}
if(ok)complete(explain);else{feedback=explain;good=false;render()}}
function render(){const done=completed.filter(Boolean).length;$('bar').style.width=done/6*100+'%';$('progressLabel').textContent=stage<6?`Mission ${stage+1} of 6`:'Mission complete';$('doneLabel').textContent=`${done} of 6 completed`;$('nav').innerHTML=missions.map((m,i)=>`<button ${i>unlocked?'disabled':''} class="${stage===i?'current':''}" data-stage="${i}" aria-label="Mission ${i+1}: ${m[0]}">${completed[i]?'✓ ':''}${i+1}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=+b.dataset.stage;briefing=!completed[stage];feedback='';render()});$('timeline').innerHTML=missions.map((m,i)=>`<span class="${completed[i]?'on':''}">${m[1]} · ${m[0]}</span>`).join('');
if(stage<6 && briefing){$('mission').innerHTML=briefingHtml();$('work').onclick=()=>{briefing=false;render()};return}
if(stage===6){$('mission').innerHTML=`<div class="success"><h2>🏆 Time Machine Complete!</h2><p>You have traced how chemistry moved from early explanations of matter to an evidence-based periodic table organized by atomic number.</p><p>Submit this completion code in Schoology:</p><div class="code">ELEMENT-1869</div><button id="copy">Copy code</button></div><h3>Six discoveries, one big idea</h3><p>Early thinkers asked what matter was. Alchemists developed techniques. Boyle and Lavoisier emphasized experiments and measurements. Döbereiner found families of three. Newlands noticed repeating patterns. Mendeleev predicted missing elements. Moseley established atomic number as the ordering principle.</p><p class="note"><strong>Exit thought:</strong> Why is a scientific model that makes a correct prediction more convincing than one that only describes what we already know?</p><div class="actions"><button class="secondary" id="back">Review previous mission</button><button id="restart">Start over</button></div>`;$('copy').onclick=()=>navigator.clipboard?.writeText('ELEMENT-1869').then(()=>{$('copy').textContent='Copied!'}).catch(()=>{});$('back').onclick=()=>{stage=5;briefing=false;feedback='';render()};$('restart').onclick=()=>{if(confirm('Start over and clear your progress?')){stage=0;unlocked=0;completed=Array(6).fill(false);state={};briefing=true;feedback='';render()}};return}
$('mission').innerHTML=missionHtml()+(feedback?`<div class="feedback ${good?'good':'bad'}" role="status"><strong>${good?'✓ Nice work!':'Not quite—try again.'}</strong><p>${feedback}</p></div>`:'')+`<div class="actions"><button class="secondary" id="prev" ${stage===0?'disabled':''}>← Previous</button><button id="next" ${!completed[stage]?'disabled':''}>${stage===5?'Finish and get code →':'Next mission →'}</button></div>`;bindOptions(choose);if(stage===5&&!state[5]?.revealed){$('reveal-order').onclick=()=>{state[5]={...(state[5]||{}),revealed:true};feedback='';render()}}$('prev').onclick=()=>{stage--;briefing=false;feedback='';render()};$('next').onclick=()=>{stage++;briefing=true;feedback='';render()}}
render();
</script></body></html>
