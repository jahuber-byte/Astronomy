<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atomic Structure: Why the Periodic Table Works</title><style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#17283c;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142e50;color:white;padding:22px max(18px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:clamp(1.4rem,3vw,2.15rem)}header p{margin:6px 0;color:#d5e5fa}main{max-width:1050px;margin:auto;padding:18px}.panel{background:white;border:1px solid #cbd8e8;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 9px #1935530c}.muted{color:#52657b}.small{font-size:.9rem}.pill{display:inline-block;background:#e6effa;color:#183c67;border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.step{padding:9px 13px;border-radius:9px;border:1px solid #bed0e3;background:#fff;color:#294563}.step.active{background:#1b4d82;color:white}.step.done{border-color:#37835e}.btn,button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;background:#174d83;color:white;padding:11px 16px;font-weight:700}.btn:hover{background:#0e3965}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e7eff8;color:#173d66}.secondary:hover{background:#d4e5f6}.choice{display:block;width:100%;text-align:left;border:2px solid #bed0e3;background:#f3f8fe;color:#142b45;padding:11px;border-radius:9px;margin:7px 0;font-weight:550}.choice:hover{border-color:#377bb9}.choice.selected{background:#d7eafa;border-color:#1265a8}.choice.correct{border-color:#168251;background:#e5f6eb}.choice.wrong{border-color:#b83f3f;background:#fff0f0}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.viz{background:#f4f8fd;border:1px solid #d6e2f0;border-radius:12px;padding:15px}.feedback{padding:12px;border-radius:9px;background:#eaf2fb;border-left:4px solid #2c6eae;margin:12px 0;min-height:48px}.feedback.good{background:#e9f7ed;border-color:#208454}.feedback.bad{background:#fff0e9;border-color:#b86b25}.atom{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:auto}.atom circle.shell{fill:none;stroke:#9ab4d3;stroke-width:1.7;stroke-dasharray:4 3}.atom .nucleus{fill:#d75b5b}.atom .electron{fill:#1e70b6;stroke:#fff;stroke-width:1}.atom .valence{fill:#f1a324;stroke:#835500;stroke-width:1.3}.atom text{fill:white;font-weight:800;font-size:13px;text-anchor:middle;dominant-baseline:central}.element{min-width:85px;padding:9px;background:#e5f1ff;border:2px solid #9abde3;color:#163c63;border-radius:10px;text-align:center}.element strong{display:block;font-size:1.5rem}.element span{font-size:.83rem}.element.selected{border-color:#125f9d;background:#cce3fc}.metric{padding:10px;background:#e9f1fb;border-radius:9px}.metric strong{font-size:1.35rem;display:block}.control{width:100%;accent-color:#16639e}label{font-weight:700}.equation{font-size:1.25rem;text-align:center;padding:12px;background:#e9f2fc;border-radius:9px}.progress{height:12px;background:#dce7f2;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#278b65;transition:width .2s}.hidden{display:none!important}.divider{border:0;border-top:1px solid #d9e3ee;margin:20px 0}.note{background:#fff8e5;border-left:4px solid #d99d26;padding:12px;border-radius:8px}.end{font-size:1.6rem;letter-spacing:.14em;font-weight:900;color:#124d7b}.ptable{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;margin:12px 0;min-width:510px}.ptable-wrap{overflow-x:auto;padding-bottom:5px}.ptcell{min-width:0;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid #aac2dc;background:#e8f2fd;color:#183b60;font-size:clamp(9px,1.35vw,15px);font-weight:800;padding:0}.ptcell:hover:not(:disabled){background:#cfe4fc;border-color:#1a629a}.ptcell.active{background:#1c5e9b;color:white;border:2px solid #0c3457}.ptcell:disabled{cursor:default;opacity:.55}.ptcell.ghost{background:#f1f3f6;color:#697b90;border-style:dashed}.ptlabel{font-size:11px;text-align:center;color:#53677e}.ptcell.empty{visibility:hidden}.ptrow{grid-column:1/-1}.force-svg{width:100%;max-width:420px;display:block;margin:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:#52657b}.swatch{display:inline-block;width:13px;height:13px;vertical-align:middle;border-radius:3px;margin-right:4px}.disabled-note{color:#52657b;font-size:.9rem}.shadebar{height:13px;border-radius:12px;background:linear-gradient(90deg,rgba(20,43,79,.75),rgba(20,43,79,.08));border:1px solid #bdcfe1}.forcebar{height:14px;border-radius:10px;background:#dce8f4;overflow:hidden}.forcebar>div{height:100%;background:#2377bd;transition:width .15s}.comparison{font-size:.87rem;color:#52657b}select{font:inherit;padding:8px;border:1px solid #b9cce1;border-radius:8px;background:white}footer{text-align:center;color:#5c6b7a;padding:24px} @media(max-width:720px){.two,.three{grid-template-columns:1fr}.panel{padding:14px}header{padding:20px}main{padding:10px}.atom{max-width:260px}}
</style></head><body><header><h1>Atomic Structure: Why the Periodic Table Works</h1><p>Experience 2 • Interactive chemistry investigation • Main-group elements</p></header><main><div class="steps" id="steps"></div><div class="panel"><div class="flex" style="justify-content:space-between"><span class="pill" id="missionTag">Mission 1 of 3</span><span class="muted small" id="status">Explore, predict, explain</span></div><div class="progress" style="margin-top:12px"><div id="progress" style="width:0%"></div></div></div><section id="content"></section></main><footer>Use your paper periodic table as a reference. All activities run offline.</footer><script>
'use strict';
const el=[['Li',3,2,1,'Lithium'],['Be',4,2,2,'Beryllium'],['B',5,2,3,'Boron'],['C',6,2,4,'Carbon'],['N',7,2,5,'Nitrogen'],['O',8,2,6,'Oxygen'],['F',9,2,7,'Fluorine'],['Ne',10,2,8,'Neon'],['Na',11,3,1,'Sodium'],['Mg',12,3,2,'Magnesium'],['Al',13,3,3,'Aluminum'],['Si',14,3,4,'Silicon'],['P',15,3,5,'Phosphorus'],['S',16,3,6,'Sulfur'],['Cl',17,3,7,'Chlorine'],['Ar',18,3,8,'Argon'],['K',19,4,1,'Potassium'],['Ca',20,4,2,'Calcium']].map(([s,z,p,v,n])=>({s,z,p,v,n,group:v<=2?v:v+10,shells:p===2?[2,z-2]:p===3?[2,8,z-10]:[2,8,8,z-18]}));
let mission=0, stage=0, selected=null, locked=false, solved=[0,0,0], attempts=0;const explored=[new Set(),new Set()];
const $=id=>document.getElementById(id);const html=s=>{ $('content').innerHTML=s;};const btn=(label,fn,extra='')=>`<button class="btn ${extra}" onclick="${fn}">${label}</button>`;
function shellSVG(e){let R=[37,69,101,126],c=145;let circles='',dots='';e.shells.forEach((n,i)=>{circles+=`<circle class="shell" cx="${c}" cy="${c}" r="${R[i]}"/>`;for(let j=0;j<n;j++){let a=(-Math.PI/2)+2*Math.PI*j/n,x=c+R[i]*Math.cos(a),y=c+R[i]*Math.sin(a);dots+=`<circle class="${i===e.shells.length-1?'valence':'electron'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`;}});return `<svg class="atom" viewBox="0 0 290 290" role="img" aria-label="Simplified shell model of ${e.n}: ${e.shells.join(', ')} electrons"><circle class="nucleus" cx="145" cy="145" r="25"/><text x="145" y="145">+${e.z}</text>${circles}${dots}</svg>`;}

function periodicPicker(chosen,callback,include4=true){
 const elements=el.filter(e=>include4||e.p<=3);
 const bySlot=new Map(elements.map(e=>[`${e.p}-${e.group}`,e]));
 let cells='';
 for(let col=1;col<=18;col++)cells+=`<div class="ptlabel" style="grid-column:${col}">${[1,2,13,14,15,16,17,18].includes(col)?col:''}</div>`;
 for(let period=1;period<=(include4?4:3);period++)for(let col=1;col<=18;col++){
  const e=bySlot.get(`${period}-${col}`);
  if(period===1&&(col===1||col===18)){cells+=`<button type="button" class="ptcell ghost" disabled title="${col===1?'Hydrogen':'Helium'}">${col===1?'H':'He'}</button>`;continue;}
  if(e){cells+=`<button type="button" class="ptcell ${e.s===chosen?'active':''}" title="${e.n}" aria-label="${e.n}, period ${period}, group ${col}" aria-pressed="${e.s===chosen}" onclick="${callback}('${e.s}')">${e.s}</button>`;}
  else cells+='<span class="ptcell empty" aria-hidden="true"></span>';
 }
 return `<div class="ptable-wrap" aria-label="Select an element on the periodic table"><div class="ptable">${cells}</div></div>`;
}
function explorationNote(which){const n=explored[which].size;const id=which===0?'m1Go':'m3Go';const status=which===0?'m1Seen':'m3Seen';const span=$(status),button=$(id);if(span)span.textContent=`${n} of 2 different elements examined${n>=2?' — ready for questions!':''}`;if(button)button.disabled=n<2;}
function pickM1(sym){drawAtom(sym);explored[0].add(sym);$('picker1').innerHTML=periodicPicker(sym,'pickM1');explorationNote(0);}
function pickM3(sym){drawShield(sym);explored[1].add(sym);$('picker3').innerHTML=periodicPicker(sym,'pickM3',false);explorationNote(1);}

function stepNav(){ $('steps').innerHTML=['Valence patterns','Coulomb’s law','Shielding & Z-effective'].map((x,i)=>`<span class="step ${i===mission?'active':i<mission?'done':''}">${i+1}. ${x}</span>`).join('');$('missionTag').textContent=`Mission ${mission+1} of 3`; $('progress').style.width=`${(solved.reduce((a,b)=>a+b,0)/12)*100}%`;}
function feedback(msg,good=null){const f=$('feedback');if(f){f.className='feedback'+(good===true?' good':good===false?' bad':'');f.innerHTML=msg;}}
function nextMission(){if(mission<2){mission++;stage=0;selected=null;locked=false;render();}else complete();}
function continueBtn(){return `<div style="margin-top:18px">${btn(mission===2?'Finish activity':'Next mission →','nextMission()')}</div>`}
const m1Questions=[{e:'Mg',q:'Magnesium has three occupied shells and two outer-shell electrons. Which group should it belong to?',options:['Group 1','Group 2','Group 13','Group 17'],correct:1,why:'Two valence electrons correspond to Group 2 for main-group elements.'},{e:'P',q:'Phosphorus has five outer-shell electrons. Which main-group column should contain it?',options:['Group 5 (transition metal)','Group 13','Group 15','Group 18'],correct:2,why:'For Groups 13–18, the ones digit of the group number equals the valence-electron count.'},{e:'K',q:'Potassium has the shell arrangement 2, 8, 8, 1. What does that predict?',options:['Period 1, Group 4','Period 4, Group 1','Period 4, Group 18','Period 3, Group 1'],correct:1,why:'Four occupied shells indicate Period 4; one outer electron indicates Group 1.'},{e:'Ne',q:'Neon has a filled outer shell of eight electrons. Which statement is best supported?',options:['It is in Group 18 and is generally unreactive.','It belongs in Group 8 and reacts readily with water.','It is a metal that usually forms +2 ions.','It is in Group 17 because it gains one electron.'],correct:0,why:'A full outer shell is characteristic of the noble gases. Helium is an exception with two electrons in its full first shell.'}];
function renderM1(){if(stage===0){html(`<div class="panel"><h2>Mission 1 — Valence Electron Patterns</h2><p>Use the interactive shell model to discover how an element's outermost electrons relate to its main-group column.</p><div class="two"><div class="viz"><label>Choose an element on the periodic table</label><div id="picker1"></div><div id="atomViz"></div></div><div><h3>Look for the pattern</h3><p>Blue dots represent inner electrons; gold dots represent <b>valence electrons</b> in the outer occupied shell.</p><div class="three"><div class="metric">Period<strong id="pVal"></strong></div><div class="metric">Group<strong id="gVal"></strong></div><div class="metric">Valence e⁻<strong id="vVal"></strong></div></div><p id="shellVal" class="muted"></p><div class="note">These are simplified shell diagrams for the first 20 elements, not exact electron orbits. For main-group elements, the valence count is usually the Group 1–2 number or the ones digit of Groups 13–18.</div><p style="margin-top:16px"><button id="m1Go" class="btn" onclick="m1Start()" disabled>Continue to questions →</button><span class="disabled-note" id="m1Seen" style="display:block;margin-top:7px"></span></p></div></div></div>`);$('picker1').innerHTML=periodicPicker('Li','pickM1');drawAtom('Li');explorationNote(0);return;}if(stage<=4){const q=m1Questions[stage-1],e=el.find(x=>x.s===q.e);renderQuestion(`Mission 1 • Challenge ${stage} of 4`,q.q,q.options,q.correct,q.why,`<div class="two"><div class="viz">${shellSVG(e)}<p class="muted" style="text-align:center">${e.n} • shell arrangement ${e.shells.join(', ')}</p></div><div><h3>Use the model, not just the element name</h3><p>Identify the outer shell and connect its electron count to a main-group column.</p></div></div>`,()=>{solved[0]++;stage++;render();});return;}html(`<div class="panel"><h2>Mission 1 complete</h2><p>You connected outer-shell electrons with group membership and occupied shells with period number.</p>${continueBtn()}</div>`);}
function drawAtom(sym){const e=el.find(x=>x.s===sym);$('atomViz').innerHTML=shellSVG(e);$('pVal').textContent=e.p;$('gVal').textContent=e.group;$('vVal').textContent=e.v;$('shellVal').textContent=`Shell arrangement: ${e.shells.join(' • ')} electrons`;}
function m1Start(){if(explored[0].size<2)return;stage=1;render();}
function renderQuestion(title,q,options,correct,why,pre,onCorrect){locked=false;selected=null;html(`<div class="panel"><h2>${title}</h2>${pre||''}<h3>${q}</h3><div id="answers">${options.map((x,i)=>`<button class="choice" data-index="${i}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div id="feedback" class="feedback">Choose an answer, then select Check answer.</div><div class="flex">${btn('Check answer','checkAnswer()')}<button class="btn secondary" onclick="showHint()">Hint</button><span id="nextWrap"></span></div></div>`);window.currentQuestion={correct,why,onCorrect,q,options};}
function choose(i){if(locked)return;selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i===j));}
function checkAnswer(){if(locked)return;if(selected===null){feedback('Select an answer first.',false);return;}const q=window.currentQuestion;attempts++;if(selected===q.correct){locked=true;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;b.classList.toggle('correct',j===selected)});feedback(`<b>Correct!</b> ${q.why}`,true);$('nextWrap').innerHTML=btn('Continue →','advanceQuestion()');}else{feedback('Not quite. Use the model or clues to reconsider, then try again.',false);document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('wrong',j===selected));}}
function advanceQuestion(){window.currentQuestion.onCorrect();}
function showHint(){const q=window.currentQuestion;if(!q)return;const hints=mission===0?'Count the outermost electrons and the occupied shells.':'Focus on what changes while the other quantities stay fixed.';feedback(hints,null);}
const m2Questions=[{q:'A nucleus has +4 units of charge and an electron is 2 distance units away. If the nuclear charge doubles and distance stays fixed, the attractive force becomes…',opts:['Half as strong','Twice as strong','Four times as strong','Unchanged'],c:1,why:'At fixed distance, force magnitude is directly proportional to nuclear charge.'},{q:'If the electron–nucleus distance doubles while charges stay the same, the force magnitude becomes…',opts:['Half as strong','Twice as strong','One-fourth as strong','Four times as strong'],c:2,why:'Distance is squared in the denominator, so doubling r reduces force to 1/4.'},{q:'If nuclear charge triples and distance doubles, the new attraction is…',opts:['Three-fourths as strong','Six times as strong','One-sixth as strong','Twelve times as strong'],c:0,why:'The factor is 3 ÷ 2² = 3/4.'},{q:'Which change increases attraction most, assuming everything else stays fixed?',opts:['Double the nuclear charge','Halve the distance','Double the distance','Halve the nuclear charge'],c:1,why:'Halving the distance makes the force four times as strong; doubling the charge only doubles it.'}];
function renderM2(){if(stage===0){html(`<div class="panel"><h2>Mission 2 — Coulomb’s Law: Nuclear Attraction Lab</h2><p>Explore the attraction between a positively charged nucleus and a negatively charged electron. This simplified model treats the nucleus and electron as two point charges.</p><div class="two"><div class="viz"><label for="charge">Nuclear charge: <b id="chargeOut">+4</b></label><input class="control" id="charge" type="range" min="1" max="20" value="4" oninput="drawForce()"><label for="distance">Electron distance: <b id="distanceOut">4</b> units</label><input class="control" id="distance" type="range" min="1" max="10" value="4" oninput="drawForce()"><svg viewBox="0 0 360 170" style="width:100%" role="img" aria-label="Schematic showing nucleus, electron, and separation"><line x1="52" y1="80" x2="305" y2="80" stroke="#8caac8" stroke-dasharray="5 5" stroke-width="3"/><circle cx="52" cy="80" r="29" fill="#d65d62"/><text id="nucText" x="52" y="86" fill="white" text-anchor="middle" font-weight="bold">+4</text><circle id="eDot" cx="174" cy="80" r="15" fill="#2774b4"/><text id="eText" x="174" y="86" fill="white" text-anchor="middle" font-weight="bold">−</text><defs><marker id="arrowForce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d57a16"/></marker></defs><line id="forceOnNucleus" x1="52" y1="37" x2="85" y2="37" stroke="#d57a16" stroke-width="5" marker-end="url(#arrowForce)"/><line id="forceOnElectron" x1="174" y1="39" x2="141" y2="39" stroke="#d57a16" stroke-width="5" marker-end="url(#arrowForce)"/><text x="180" y="145" text-anchor="middle" fill="#51657b">Equal and opposite forces • arrows show relative strength</text></svg></div><div><div class="equation">Attraction ∝ nuclear charge ÷ distance²</div><p class="small muted">For two point charges, Coulomb’s law is F = k |q₁q₂| / r². Here, electron charge is fixed at −1, and we compare relative force magnitudes.</p><div class="metric">Relative attraction<strong id="forceOut">0.250</strong></div><div class="forcebar" aria-label="Relative force strength"><div id="forceBar" style="width:10%"></div></div><p class="small muted">Orange arrows: force on nucleus points toward electron; force on electron points toward nucleus. The forces are always equal in magnitude and opposite in direction (Newton’s third law).</p><div class="metric" style="margin-top:9px">Compared with +4 at distance 4<strong id="ratioOut">1.00×</strong></div><p class="note">Prediction to try: Keep the distance fixed and double the nuclear charge. Then reset and double the distance instead.</p><p>${btn('Begin prediction challenges →','m2Start()')}</p></div></div></div>`);drawForce();return;}if(stage<=4){let q=m2Questions[stage-1];renderQuestion(`Mission 2 • Challenge ${stage} of 4`,q.q,q.opts,q.c,q.why,'',()=>{solved[1]++;stage++;render();});return;}html(`<div class="panel"><h2>Mission 2 complete</h2><p>You explored how the strength of electrical attraction depends on charge and the square of distance.</p>${continueBtn()}</div>`);}
function drawForce(){const z=+$('charge').value,r=+$('distance').value; $('chargeOut').textContent='+'+z;$('distanceOut').textContent=r;$('nucText').textContent='+'+z;let x=72+r*24;$('eDot').setAttribute('cx',x);$('eText').setAttribute('x',x);let f=z/(r*r);$('forceOut').textContent=f.toFixed(3);$('ratioOut').textContent=(f/.25).toFixed(2)+'×';let length=12+Math.min(55,Math.log1p(f)*18);let nx=52+length,ex=x-length;$('forceOnNucleus').setAttribute('x2',nx);$('forceOnElectron').setAttribute('x1',x);$('forceOnElectron').setAttribute('x2',ex);$('forceBar').style.width=`${Math.max(2,Math.min(100,100*Math.log1p(f)/Math.log1p(20)))}%`;}
function m2Start(){stage=1;render();}
const m3Questions=[{q:'Sodium and chlorine both have ten electrons in their first two shells. Which atom has the larger simplified effective nuclear charge acting on its outer electrons?',opts:['Sodium, because it has fewer protons','Chlorine, because it has more protons with the same inner-shell count','They are equal because both have three shells','Neither has any nuclear attraction'],c:1,why:'In the simple model, Na: 11 − 10 = +1 and Cl: 17 − 10 = +7. The shared inner-shell count makes the proton difference important.'},{q:'Compare lithium (3 protons, 2 inner electrons) with sodium (11 protons, 10 inner electrons). Their simplified Z-effective estimates are both +1. Why can their outer electrons still experience different attractions?',opts:['Electron distance and the spatial distribution of shielding also matter','All atoms have identical electron distances','Neutrons cancel the attraction completely','Effective nuclear charge is always the full proton count'],c:0,why:'The outer electron in sodium occupies a higher shell and is generally farther from the nucleus. Equal crude Z-effective estimates do not mean equal attraction.'},{q:'Across Period 3 from sodium to chlorine, which statement best explains the increasing effective nuclear attraction?',opts:['The number of inner-shell electrons increases by six','The nucleus gains protons while the number of inner-shell electrons remains ten','The number of occupied shells decreases','Neutrons become negatively charged'],c:1,why:'The proton count increases while the simplified inner-shell shielding count stays constant across this period.'},{q:'Which statement best describes the limits of the simplified Z-effective estimate used here?',opts:['Each inner electron perfectly blocks exactly one proton in all real atoms','It gives a useful pattern, but actual shielding and electron interactions are more complex','Only neutrons determine electron attraction','Outer electrons never repel one another'],c:1,why:'Subtracting inner electrons from protons is a classroom approximation, not a precise calculation of effective nuclear charge.'}];
function renderM3(){if(stage===0){html(`<div class="panel"><h2>Mission 3 — Shielding and Effective Nuclear Charge</h2><p>Outer electrons are attracted to the nucleus but also repelled by other electrons. Inner electrons partially shield outer electrons from nuclear attraction.</p><div class="two"><div class="viz"><label>Choose an element to investigate</label><div id="picker3"></div><div id="shieldAtom"></div></div><div><h3>Approximate shielding model</h3><div class="metric">Protons in nucleus<strong id="protons">11</strong></div><div class="metric" style="margin-top:9px">Inner-shell electrons<strong id="inner">10</strong></div><div class="metric" style="margin-top:9px">Simplified Z<sub>eff</sub> = protons − inner electrons<strong id="zeff">+1</strong></div><p id="shieldSummary" class="muted"></p><div class="metric">Illustrative outer-shell distance<strong id="shellDistance"></strong></div><div class="metric" style="margin-top:9px">Illustrative attraction index (Z<sub>eff</sub> ÷ shell number²)<strong id="pullIndex"></strong></div><p class="small muted">This index is for comparison only, not a measured force or a precise atomic calculation.</p><div class="shadebar" aria-hidden="true"></div><p class="small muted">Dark overlay = weaker net nuclear pull in this model; lighter overlay = stronger net pull. This shading is a visual metaphor, not an actual electron cloud.</p><div class="note"><b>Important limitation:</b> Inner electrons do not perfectly cancel nuclear charge. Actual effective nuclear charge depends on electron distributions and interactions. The simple subtraction model is used here to reveal a broad pattern, not to calculate an exact force.</div><p><button id="m3Go" class="btn" onclick="m3Start()" disabled>Continue to questions →</button><span class="disabled-note" id="m3Seen" style="display:block;margin-top:7px"></span></p></div></div></div>`);$('picker3').innerHTML=periodicPicker('Na','pickM3',false);drawShield('Na');explorationNote(1);return;}if(stage<=4){let q=m3Questions[stage-1];renderQuestion(`Mission 3 • Challenge ${stage} of 4`,q.q,q.opts,q.c,q.why,'',()=>{solved[2]++;stage++;render();});return;}html(`<div class="panel"><h2>Mission 3 complete</h2><p>You used proton counts, inner-shell electrons, and electron distance to explain why outer electrons can experience different attractions.</p>${continueBtn()}</div>`);}
function drawShield(sym){
 const e=el.find(x=>x.s===sym),inner=e.z-e.v,zeff=e.z-inner;
 const overlayOpacity=(.68-(zeff-1)*.075).toFixed(2);
 const shieldRadius=e.p===2?52:83;
 const ringRadius=e.p===2?69:101;
 const graphic=shellSVG(e).replace('</svg>',`<circle cx="145" cy="145" r="${shieldRadius}" fill="#102e57" opacity="${overlayOpacity}" pointer-events="none"/><line x1="145" y1="145" x2="${145+ringRadius}" y2="145" stroke="#e16c24" stroke-width="2.5" stroke-dasharray="5 4"/><text x="${145+ringRadius/2}" y="137" fill="#9b4b11" font-size="10" text-anchor="middle">distance</text></svg>`);
